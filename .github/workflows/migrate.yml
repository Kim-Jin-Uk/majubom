# DB 마이그레이션 — 정본: 08_코드관리_전략 §6.3 (주의점 5개), §5.5 (러너 요건)
#
# main  푸시 → staging  환경 시크릿으로 스테이징 DB
# release 푸시 → production 환경 시크릿으로 프로덕션 DB
#
# TODO(2기, W15 이후 — 08 §3.3): release 브랜치는 App Hosting 자동 롤아웃을 OFF 로 두고,
#   이 워크플로 뒤에 `firebase apphosting:rollouts:create --git_commit $GITHUB_SHA` 단계를 추가한다.
#   (백업 → 마이그레이션 → 불변 제약 → Firestore 인덱스/규칙 배포 → 롤아웃 순서를 한 워크플로가 강제)
#   지금(1기)은 마이그레이션 + 검증까지만 한다.
name: migrate

on:
  push:
    branches: [main, release]
    # required check 이 아니므로 paths 필터가 안전하다 (08 §6.3 #5).
    paths:
      - 'drizzle/**'
      - 'scripts/db/**'
      - '.github/workflows/migrate.yml'

# cancel-in-progress 는 절대 true 로 바꾸지 않는다 (08 §6.3 #1).
# DDL 도중 SIGKILL 되면 드리즐 저널에는 적용된 것으로 남는데 실제 DDL 은 절반만 나간 상태가 되고,
# revert 로도 PITR 로도 되돌릴 수 없다. 같은 브랜치의 연속 푸시는 순서대로 기다린다.
concurrency:
  group: migrate-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # GitHub Environments 로 staging / production 시크릿을 가른다 (08 §6.3 #2).
    # 시크릿 하나로 양쪽을 돌리면 스테이징 푸시가 프로덕션 스키마를 바꾼다.
    # production 환경에는 required reviewer(본인)를 걸어 둔다 — 1인 개발의 마지막 안전핀 (08 §6.3 #3).
    # 두 환경 모두 `DATABASE_URL_MIGRATE` 시크릿(Neon 직결/unpooled 엔드포인트)을 가진다.
    environment: ${{ github.ref_name == 'release' && 'production' || 'staging' }}
    env:
      # 러너(scripts/db/_conn.ts)는 pooled(`pooler.`) 엔드포인트를 거부한다 — 직결 URL 을 넣을 것.
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_MIGRATE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # lock_timeout 3s · statement_timeout 60s · 락 실패 시 최대 5회 지수 백오프 (scripts/db/migrate.ts)
      - name: Apply migrations
        run: npm run db:migrate

      # 적용 직후 스키마 불변 제약을 다시 확인한다 (08 §6.1). 여기서 실패하면 롤아웃(2기)으로 넘어가지 않는다.
      - name: Schema invariants
        run: npm run db:check

      # TODO(08 §6.3 #4): 실패 알림. FR-INFRA-010 의 "연속 2회 실패 시 Sentry" 규칙을 마이그레이션에도 적용한다.
      #   `if: failure()` 스텝으로 Sentry(또는 웹훅) 이벤트를 보내는 단계를 후속 이슈에서 추가.
