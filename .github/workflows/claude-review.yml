# AI 코드 리뷰 — PR 이 열리거나 갱신될 때 Claude 가 diff 를 읽고 코멘트를 남긴다.
#
# 게이트가 아니다. required status check 에 넣지 않는다 (08 §6.6) — 사람 리뷰어가 없는 1인 개발에서
# "두 번째 눈" 역할이고, 판단은 본인이 한다. 실패해도 머지를 막지 않는다.
#
# 인증: CLAUDE_CODE_OAUTH_TOKEN (Claude Pro/Max — `claude setup-token` 으로 발급) 를 저장소 시크릿에.
#       API 키를 쓰려면 아래 `claude_code_oauth_token` 줄을 `anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}` 로.
# 선행: Claude GitHub App 설치 — https://github.com/apps/claude (저장소 admin)
name: claude-review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    branches: [main, release]

# 같은 PR 에 연속 push 하면 이전 리뷰를 취소 — 토큰 낭비 방지
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    name: claude-review
    # Draft 는 건너뛴다. ready_for_review 로 전환되는 순간 한 번 돈다
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            너는 '마주,봄' 예약 SaaS 의 코드 리뷰어다. 1인 개발이라 사람 리뷰어가 없다 — 네가 두 번째 눈이다.
            PR 브랜치가 현재 디렉토리에 체크아웃돼 있다. `gh pr diff` 로 변경을 보고, 문맥이 필요하면 Read/Grep 으로 파일을 읽어라.
            기획·명세 문서는 private 저장소에 있어 볼 수 없다. 저장소의 CLAUDE.md 와 아래 규칙이 기준이다.

            ## 우선순위 (이 순서로만 본다)
            1. 버그 · 데이터 손상 · 보안 — 반드시 지적
            2. 아래 프로젝트 규칙 위반 — 반드시 지적
            3. 설계 문제 — 확신이 있을 때만
            4. 스타일 · 포맷 · 네이밍 — **언급 금지.** lint 가 본다

            ## 프로젝트 규칙
            **마이그레이션 (`drizzle/**`, `scripts/db/**`)**
            - `CASCADE` 금지 — 제약이 의존 객체와 함께 조용히 사라진다
            - 제약 술어(EXCLUDE WHERE, 부분 인덱스)에 쓰이는 컬럼은 `NOT NULL DEFAULT` — nullable 이면 NULL 행이 제약 밖으로 빠진다
            - enum 값 추가와 그 값 사용은 별도 마이그레이션 파일 (같은 트랜잭션 안에서 새 enum 값 사용 불가)
            - 옛 코드가 새 스키마에서 동작하는가 (expand). 컬럼 삭제·NOT NULL 즉시 부여·이름 변경은 3단계여야 한다
            - `ACCESS EXCLUSIVE` 를 잡는 DDL (EXCLUDE 제약 추가 등) 은 무중단 불가 — 표시하라
            **예약 엔진 (`src/features/booking`, `reservations` 관련)**
            - 이중 예약 방어는 DB 가 한다: `no_overlap` EXCLUDE (정원 1) + `pg_advisory_xact_lock` (정원 N). 애플리케이션 검사만으로 대체하는 코드는 결함
            - `Reservation.exclusive` 는 생성 시점 스냅샷 `= resource.capacity == 1`. `occupyRange` 는 버퍼 포함
            - 잔여 정원은 스윕라인(순간 최대 동시 인원). 겹치는 예약의 partySize 합산은 버그
            - 상태 전이는 조건부 UPDATE (`WHERE status = 이전`) — 0행이면 409
            **보안·개인정보**
            - 시크릿 하드코딩, `NEXT_PUBLIC_` 에 비밀값·기능 플래그 (플래그는 서버 전용 `src/lib/flags.ts`)
            - 콘솔 API 는 `businessId` 스코프 검사 필수. 타 사업장 리소스는 **404** (403 은 존재를 노출)
            - 고객용 응답에 `senderUserId`·매니저 연락처 노출 금지. 로그·Sentry 에 연락처·이메일 금지
            **Firestore (`firestore.rules`)**
            - 규칙 넓히기는 코드보다 먼저, 좁히기는 코드보다 나중. 필드 접근은 `.get(field, default)`
            - 방 문서 쓰기는 서버(Admin SDK) 전용이어야 한다

            ## 출력 방식
            - 한국어. 짧게. 근거 없는 추측·칭찬·변경 요약 나열 금지
            - 확실한 문제는 `mcp__github_inline_comment__create_inline_comment` (`confirmed: true`) 로 해당 줄에. 한 문제당 하나, 왜 문제인지 + 고치는 방향 한 줄
            - 마지막에 톱레벨 요약 **하나**: 본문을 Write 도구로 `/tmp/review.md` 에 쓰고, 정확히 이 한 줄 명령으로 올린다
              (다른 형태의 명령은 권한 규칙에 막힌다 — heredoc·`$(…)`·여러 줄 금지):
              `gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/review.md`
              - 첫 줄: `판정: 머지 가능` 또는 `판정: 수정 필요` 또는 `판정: 확인 필요`
              - 심각도별로 각 3줄 이내 (치명 / 중대 / 경미). 해당 없으면 생략
              - 관련 세부 이슈 번호(`#n`)가 PR 본문에 있으면 참조
            - 문제가 없으면 인라인 코멘트 없이 `판정: 머지 가능 — 특이사항 없음` 한 줄
            - 리뷰 내용을 채팅 메시지로 출력하지 말고 GitHub 코멘트로만 남겨라

          # 권한 규칙 메모: Bash(prefix:*) 는 명령이 한 줄이고 서브셸($()·백틱)이 없을 때만 매치된다.
          # 첫 실행(PR #153)에서 요약 코멘트가 7회 거부된 원인 — 그래서 --body-file 로 고정했다.
          # show_full_output 은 거부 사유·리뷰 본문을 로그에 남긴다 (공개 저장소라 코드 노출은 문제가 아니다). 안정되면 내린다.
          show_full_output: true
          claude_args: |
            --max-turns 50
            --allowedTools "Read,Grep,Glob,Write,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*)"
