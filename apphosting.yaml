# Firebase App Hosting 백엔드 설정 (프로덕션 기본값)
# 이 파일은 커밋해도 안전하다 — 시크릿은 값이 아니라 Secret Manager 이름만 적는다.
# 스테이징은 apphosting.staging.yaml 로 덮어쓴다.

runConfig:
  minInstances: 0        # 무료 한도 유지. 콜드스타트 감수
  maxInstances: 3        # 종량제 폭주 방어선 (06 리스크 T1)
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: majubom
    availability: [BUILD, RUNTIME]

  # NEXT_PUBLIC_FIREBASE_API_KEY 는 **일부러 없다**. App Hosting 파서는 `value: ""` 를 "값 없음" 으로 보고
  # 빌드를 통째로 거부한다(fah/invalid-apphosting-yaml, "either 'value' or 'secret' field is required').
  # 지금 이 키를 읽는 코드가 없으므로(웹 푸시 에픽에서 처음 필요해진다) 빈 값으로 자리만 잡아 두지 않는다.
  # 필요해지면 그때 실제 값을 넣는다 — 클라이언트에 노출되는 값이라 시크릿이 아니다.

  # ── 시크릿: Cloud Secret Manager 참조 ──
  # 등록: firebase apphosting:secrets:set DATABASE_URL
  - variable: DATABASE_URL
    secret: DATABASE_URL
    availability: [RUNTIME]

  # ── 인증 (features/auth/README.md) ──
  # AUTH_URL 은 시크릿이 아니라 값이다. 커스텀 도메인(#12)이 붙으면 https://majubom.kr 로 바꾼다.
  - variable: AUTH_URL
    value: https://majubom--majubom-bb43e.asia-east1.hosted.app
    availability: [RUNTIME]

  - variable: AUTH_SECRET
    secret: AUTH_SECRET
    availability: [RUNTIME]

  # 소셜 키는 ID·SECRET 쌍으로만 넣는다 (env 검증이 짝을 요구한다). 카카오 앱 등록(#12) 후 두 줄씩 추가:
  #   - variable: AUTH_KAKAO_ID     value: <REST API 키>
  #   - variable: AUTH_KAKAO_SECRET secret: AUTH_KAKAO_SECRET
  #   - variable: AUTH_GOOGLE_ID    value: <클라이언트 ID>
  #   - variable: AUTH_GOOGLE_SECRET secret: AUTH_GOOGLE_SECRET

  # FIREBASE_ADMIN_PRIVATE_KEY 도 **일부러 없다**. `admin.ts` 는 FIREBASE_ADMIN_ 셋(PROJECT_ID·CLIENT_EMAIL·PRIVATE_KEY)이
  # 모두 있을 때만 서비스 계정으로 초기화하고, 아니면 ADC(App Hosting 런타임 서비스 계정)로 간다.
  # 여기에 PRIVATE_KEY 만 선언해도 그 조건을 못 채워 ADC 경로 그대로다 — 역할은 없고, 시크릿이 없으면
  # fah/misconfigured-secret 으로 빌드만 죽는다. 서비스 계정 키로 가야 할 이유가 생기면 세 개를 함께 넣는다.

  # ── R2 (다섯 개는 세트 — 일부만 있으면 env 검증이 거부한다) ──
  - variable: R2_ACCOUNT_ID
    value: 4eed3b7245890b9f4b0aa2009ced3bbb
    availability: [RUNTIME]
  - variable: R2_BUCKET
    value: majubom-media
    availability: [RUNTIME]
  - variable: R2_PUBLIC_BASE_URL
    value: https://pub-d21aeed42229451a96f808615433a48b.r2.dev
    availability: [BUILD, RUNTIME]   # next.config 의 images.remotePatterns 가 빌드 시점에 읽는다
  - variable: R2_ACCESS_KEY_ID
    secret: R2_ACCESS_KEY_ID
    availability: [RUNTIME]
  - variable: R2_SECRET_ACCESS_KEY
    secret: R2_SECRET_ACCESS_KEY
    availability: [RUNTIME]

  # ── 메일 (Resend) — production 에서는 필수 ──
  - variable: RESEND_API_KEY
    secret: RESEND_API_KEY
    availability: [RUNTIME]
  - variable: MAIL_FROM
    value: "마주,봄 <onboarding@resend.dev>"   # 도메인 검증(#12) 후 no-reply@majubom.kr
    availability: [RUNTIME]

  - variable: CRON_SECRET
    secret: CRON_SECRET
    availability: [RUNTIME]
